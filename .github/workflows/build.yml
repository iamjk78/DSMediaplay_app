name: Build

# Manual or tag-triggered only: macOS runners are billed at 10x and Windows at 2x of the included minutes.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, windows, macos]
        default: all
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0); leave empty for a plain build"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `inputs` is empty for tag pushes, which build everything
        platform: ${{ fromJSON((inputs.platform || 'all') == 'all' && '["windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build
        run: python -m PyInstaller --noconfirm DSM_GUI.spec

      - name: Verify that no local configuration or secrets ended up in the build
        run: |
          leaked=$(find dist \( -name 'login*.json' -o -name 'email_config.json' -o -name 'service.json' \) | grep -v 'login.example.json' || true)
          if [ -n "$leaked" ]; then
            echo "Sensitive files found in build output:"; echo "$leaked"; exit 1
          fi

      - name: Verify that the CA bundle needed for TLS verification is bundled
        run: find dist -name cacert.pem | grep -q . || { echo "certifi CA bundle missing from build"; exit 1; }

      - name: Verify that the Windows runtime pieces are bundled (Tcl/Tk, credential store backend)
        if: runner.os == 'Windows'
        run: |
          missing=0
          find dist -iname '_tkinter*' | grep -q . || { echo "missing: _tkinter"; missing=1; }
          find dist -iname 'tcl*.dll' | grep -q . || { echo "missing: Tcl DLL"; missing=1; }
          find dist -type d -name '_tcl_data' | grep -q . || { echo "missing: Tcl data"; missing=1; }
          find dist -type d -name '_tk_data' | grep -q . || { echo "missing: Tk data"; missing=1; }
          # Pure-Python modules are packed inside the executable's PYZ archive, not stored as folders
          for module in keyring.backends.Windows win32ctypes.pywin32.win32cred; do
            grep -q "$module" build/DSM_GUI/PYZ-00.toc || { echo "missing module: $module (Windows Credential Manager backend)"; missing=1; }
          done
          [ "$missing" = "0" ] || { echo "--- bundle top level:"; ls dist/DSM_GUI dist/DSM_GUI/_internal | head -60; exit 1; }

      - name: Smoke test (app starts and serves its bundled documentation)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/DSM_GUI/DSM_GUI.exe &
          else
            ./dist/DSM_GUI.app/Contents/MacOS/DSM_GUI &
          fi
          app_pid=$!
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/en/; then ok=1; break; fi
            sleep 1
          done
          kill -0 $app_pid 2>/dev/null && alive=1
          kill $app_pid 2>/dev/null || true
          [ "${ok:-0}" = "1" ] && [ "${alive:-0}" = "1" ] || { echo "Application did not start or crashed"; exit 1; }

      # GitHub wraps every artifact in a zip, so the Windows folder is uploaded as it is (no zip inside a zip).
      # macOS keeps its own zip because artifact uploads drop file permissions and symlinks that the .app needs.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/DSM_GUI.app DSM_GUI-macos.zip

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DSM_GUI-windows
          path: dist
          if-no-files-found: error

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DSM_GUI-macos
          path: DSM_GUI-macos.zip
          if-no-files-found: error

  release:
    # Runs for a tag push or when a release tag is given; only after every requested platform built successfully
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          files=()
          if [ -d artifacts/DSM_GUI-windows ]; then
            (cd artifacts/DSM_GUI-windows && zip -qr "$GITHUB_WORKSPACE/DSM_GUI-windows.zip" DSM_GUI)
            files+=("DSM_GUI-windows.zip")
          fi
          if [ -f artifacts/DSM_GUI-macos/DSM_GUI-macos.zip ]; then
            files+=("artifacts/DSM_GUI-macos/DSM_GUI-macos.zip")
          fi
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DSM_GUI $TAG" --generate-notes
