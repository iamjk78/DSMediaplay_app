name: Build

# Manual or tag-triggered only: macOS runners are billed at 10x and Windows at 2x of the included minutes.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, windows, macos]
        default: all
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0); leave empty for a plain build"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `inputs` is empty for tag pushes, which build everything
        platform: ${{ fromJSON((inputs.platform || 'all') == 'all' && '["windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    defaults:
      run:
        shell: bash
    env:
      # Only set when a release is being published; it becomes the installer version
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the check below asks whether the commit is on main

      # First, so that nothing is built (2-4 minutes, and an installer with a version nobody checked) for a release that
      # would be refused at the end
      - name: Check the release tag and where it is built from
        if: env.RELEASE_TAG != ''
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "Invalid release tag: $RELEASE_TAG"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "A release is built only from a commit that is on main"; exit 1; }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build
        run: python -m PyInstaller --noconfirm DSMediaplay_app.spec

      - name: Verify that no local configuration or secrets ended up in the build
        run: |
          leaked=$(find dist \( -name 'login*.json' -o -name 'email_config.json' -o -name 'service.json' \) | grep -v 'login.example.json' || true)
          if [ -n "$leaked" ]; then
            echo "Sensitive files found in build output:"; echo "$leaked"; exit 1
          fi

      - name: Verify that the CA bundle needed for TLS verification is bundled
        run: find dist -name cacert.pem | grep -q . || { echo "certifi CA bundle missing from build"; exit 1; }

      - name: Verify that the Windows runtime pieces are bundled (Tcl/Tk, credential store backend)
        if: runner.os == 'Windows'
        run: |
          missing=0
          find dist -iname '_tkinter*' | grep -q . || { echo "missing: _tkinter"; missing=1; }
          find dist -iname 'tcl*.dll' | grep -q . || { echo "missing: Tcl DLL"; missing=1; }
          find dist -type d -name '_tcl_data' | grep -q . || { echo "missing: Tcl data"; missing=1; }
          find dist -type d -name '_tk_data' | grep -q . || { echo "missing: Tk data"; missing=1; }
          # Pure-Python modules are packed inside the executable's PYZ archive, not stored as folders
          for module in keyring.backends.Windows win32ctypes.pywin32.win32cred; do
            grep -q "$module" build/DSMediaplay_app/PYZ-00.toc || { echo "missing module: $module (Windows Credential Manager backend)"; missing=1; }
          done
          [ "$missing" = "0" ] || { echo "--- bundle top level:"; ls dist/DSMediaplay_app dist/DSMediaplay_app/_internal | head -60; exit 1; }

      - name: Smoke test (app starts and serves its bundled documentation)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then exe=./dist/DSMediaplay_app/DSMediaplay_app.exe; else exe=./dist/DSMediaplay_app.app/Contents/MacOS/DSMediaplay_app; fi
          bash packaging/smoke_test.sh "$exe"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress -y  # pinned: what is installed here ends up in the installer

      - name: Build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { '0.0.0-dev' }
          $numeric = if ($version -match '^\d+\.\d+\.\d+') { "$($Matches[0]).0" } else { '0.0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DAppNumericVersion=$numeric" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist-installer

      - name: Test the installer (install, reinstall over it, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist-installer -Filter 'DSMediaplay_app-Setup-*.exe').FullName
          $dir = Join-Path $env:RUNNER_TEMP 'DSMediaplay_app_installed'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{DB940A40-CA4A-48BB-B2CA-1A0D44974506}_is1'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\DSMediaplay_app.lnk'

          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\DSMediaplay_app.exe")) { throw 'The installer did not install DSMediaplay_app.exe' }
          if (-not (Test-Path $uninstallKey)) { throw 'No uninstall entry (Apps & features) was registered' }
          if (-not (Test-Path $shortcut)) { throw 'No Start menu shortcut was created' }

          & "$env:ProgramFiles\Git\bin\bash.exe" packaging/smoke_test.sh "$dir\DSMediaplay_app.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The installed application failed the smoke test' }

          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller finishes in a temporary copy of itself, so wait for the result
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -or (Test-Path $uninstallKey) -or (Test-Path $shortcut)) {
            if ((Get-Date) -gt $deadline) { throw 'The uninstaller left files, the shortcut or the registry entry behind' }
            Start-Sleep -Seconds 2
          }

          # Installing a new version over an installed one has to uninstall the old one first. An "old" version is made
          # here: the same application plus a file of its own, which the new version does not have. Only what the old
          # installer installed is known to its uninstaller, so this file is what tells an uninstall from an overwrite.
          $oldDir = Join-Path $env:RUNNER_TEMP 'old-installer'
          $extra = 'dist\DSMediaplay_app\file_of_the_old_version.txt'
          Set-Content $extra 'old'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" '/DAppVersion=0.0.1-old' '/DAppNumericVersion=0.0.1.0' "/O$oldDir" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed for the old version with exit code $LASTEXITCODE" }
          Remove-Item $extra
          $old = (Get-ChildItem $oldDir -Filter 'DSMediaplay_app-Setup-*.exe').FullName
          $stale = Join-Path $dir 'file_of_the_old_version.txt'
          $userData = Join-Path $env:APPDATA 'DSM_GUI'
          $marker = Join-Path $userData 'installer_test_marker.txt'
          New-Item -ItemType Directory -Force $userData | Out-Null
          Set-Content $marker 'keep'

          Start-Process $old -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait
          if (-not (Test-Path $stale)) { throw 'The old version did not install its own file, the test proves nothing' }
          $running = Start-Process "$dir\DSMediaplay_app.exe" -PassThru   # running while the new version comes
          Start-Sleep -Seconds 8

          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait
          if (Test-Path $stale) { throw 'The old version was not uninstalled first: a file of it is still there' }
          if (-not (Test-Path "$dir\DSMediaplay_app.exe")) { throw 'The new version did not install DSMediaplay_app.exe' }
          if (-not (Test-Path $uninstallKey)) { throw 'No uninstall entry after installing over the old version' }
          if (-not (Test-Path $shortcut)) { throw 'No Start menu shortcut after installing over the old version' }
          if (-not $running.HasExited) { throw 'The running instance of the old version was not closed' }
          if (-not (Test-Path $marker)) { throw 'Installing over the old version removed the user data' }
          & "$env:ProgramFiles\Git\bin\bash.exe" packaging/smoke_test.sh "$dir\DSMediaplay_app.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The application installed over the old version failed the smoke test' }

          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -or (Test-Path $uninstallKey) -or (Test-Path $shortcut)) {
            if ((Get-Date) -gt $deadline) { throw 'The uninstaller left files, the shortcut or the registry entry behind' }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $marker)) { throw 'The uninstaller removed the user data' }
          Remove-Item $marker

      # GitHub wraps every artifact in a zip; a release asset is the file itself, so releases carry the bare installer.
      # macOS has a disk image (the usual way to install there) and, next to it, its own zip because artifact uploads drop
      # file permissions and symlinks that the .app needs.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/DSMediaplay_app.app DSMediaplay_app-macos.zip
          version="${RELEASE_TAG#v}"
          version="${version:-0.0.0-dev}"
          staging=$(mktemp -d)
          ditto dist/DSMediaplay_app.app "$staging/DSMediaplay_app.app"
          ln -s /Applications "$staging/Applications"   # the folder to drag the application to
          hdiutil create -volname "DSMediaplay_app" -srcfolder "$staging" -ov -format UDZO "DSMediaplay_app-$version-macos.dmg"
          rm -rf "$staging"

      - name: Test the disk image (it is sound, holds the application, which starts from it)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          image=$(ls DSMediaplay_app-*-macos.dmg)
          hdiutil verify "$image"
          mount=$(mktemp -d)
          hdiutil attach "$image" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount" -force >/dev/null 2>&1 || true' EXIT
          [ -d "$mount/DSMediaplay_app.app" ] || { echo "The disk image does not hold the application"; exit 1; }
          [ -L "$mount/Applications" ] || { echo "The disk image has no link to the Applications folder"; exit 1; }
          codesign --verify --deep --strict "$mount/DSMediaplay_app.app"
          bash packaging/smoke_test.sh "$mount/DSMediaplay_app.app/Contents/MacOS/DSMediaplay_app"

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DSMediaplay_app-windows
          path: dist-installer/DSMediaplay_app-Setup-*.exe
          if-no-files-found: error

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DSMediaplay_app-macos
          path: |
            DSMediaplay_app-*-macos.dmg
            DSMediaplay_app-macos.zip
          if-no-files-found: error

  test:
    # The tests open real windows, so they run where there is a desktop: on Linux they would skip most of themselves
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((inputs.platform || 'all') == 'all' && '["windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        env:
          DSM_TESTS_VISIBLE: "1"  # nobody works at this computer; and a fully transparent window is not hit by the pointer
        run: python -m pytest -q -p no:cacheprovider

  audit:
    # Known vulnerabilities in what goes into the application and into its build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Audit the dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-build.txt

  release:
    # Runs for a tag push or when a release tag is given; only after every requested platform was built and tested
    needs: [build, test, audit]
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          shopt -s nullglob
          files=(artifacts/DSMediaplay_app-windows/DSMediaplay_app-Setup-*.exe artifacts/DSMediaplay_app-macos/DSMediaplay_app-*-macos.dmg
                 artifacts/DSMediaplay_app-macos/DSMediaplay_app-macos*.zip)
          [ "${#files[@]}" -gt 0 ] || { echo "No release files found"; exit 1; }
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DSMediaplay_app $TAG" --generate-notes
