name: Build

# Manual or tag-triggered only: macOS runners are billed at 10x and Windows at 2x of the included minutes.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [all, windows, macos]
        default: all
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v1.0.0); leave empty for a plain build"
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `inputs` is empty for tag pushes, which build everything
        platform: ${{ fromJSON((inputs.platform || 'all') == 'all' && '["windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || 'macos-latest' }}
    defaults:
      run:
        shell: bash
    env:
      # Only set when a release is being published; it becomes the installer version
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build
        run: python -m PyInstaller --noconfirm DSMediaplay_app.spec

      - name: Verify that no local configuration or secrets ended up in the build
        run: |
          leaked=$(find dist \( -name 'login*.json' -o -name 'email_config.json' -o -name 'service.json' \) | grep -v 'login.example.json' || true)
          if [ -n "$leaked" ]; then
            echo "Sensitive files found in build output:"; echo "$leaked"; exit 1
          fi

      - name: Verify that the CA bundle needed for TLS verification is bundled
        run: find dist -name cacert.pem | grep -q . || { echo "certifi CA bundle missing from build"; exit 1; }

      - name: Verify that the Windows runtime pieces are bundled (Tcl/Tk, credential store backend)
        if: runner.os == 'Windows'
        run: |
          missing=0
          find dist -iname '_tkinter*' | grep -q . || { echo "missing: _tkinter"; missing=1; }
          find dist -iname 'tcl*.dll' | grep -q . || { echo "missing: Tcl DLL"; missing=1; }
          find dist -type d -name '_tcl_data' | grep -q . || { echo "missing: Tcl data"; missing=1; }
          find dist -type d -name '_tk_data' | grep -q . || { echo "missing: Tk data"; missing=1; }
          # Pure-Python modules are packed inside the executable's PYZ archive, not stored as folders
          for module in keyring.backends.Windows win32ctypes.pywin32.win32cred; do
            grep -q "$module" build/DSMediaplay_app/PYZ-00.toc || { echo "missing module: $module (Windows Credential Manager backend)"; missing=1; }
          done
          [ "$missing" = "0" ] || { echo "--- bundle top level:"; ls dist/DSMediaplay_app dist/DSMediaplay_app/_internal | head -60; exit 1; }

      - name: Smoke test (app starts and serves its bundled documentation)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then exe=./dist/DSMediaplay_app/DSMediaplay_app.exe; else exe=./dist/DSMediaplay_app.app/Contents/MacOS/DSMediaplay_app; fi
          bash packaging/smoke_test.sh "$exe"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { '0.0.0-dev' }
          $numeric = if ($version -match '^\d+\.\d+\.\d+') { "$($Matches[0]).0" } else { '0.0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DAppNumericVersion=$numeric" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist-installer

      - name: Test the installer (install, reinstall over it, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist-installer -Filter 'DSMediaplay_app-Setup-*.exe').FullName
          $dir = Join-Path $env:RUNNER_TEMP 'DSMediaplay_app_installed'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{DB940A40-CA4A-48BB-B2CA-1A0D44974506}_is1'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\DSMediaplay_app.lnk'

          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait
          if (-not (Test-Path "$dir\DSMediaplay_app.exe")) { throw 'The installer did not install DSMediaplay_app.exe' }
          if (-not (Test-Path $uninstallKey)) { throw 'No uninstall entry (Apps & features) was registered' }
          if (-not (Test-Path $shortcut)) { throw 'No Start menu shortcut was created' }

          & "$env:ProgramFiles\Git\bin\bash.exe" packaging/smoke_test.sh "$dir\DSMediaplay_app.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The installed application failed the smoke test' }

          # Installing again over the installed version: it has to be uninstalled first, so a file of it that the new
          # version does not have is gone afterwards, a running instance is closed, and the user data stays
          $stale = Join-Path $dir 'file_of_the_old_version.txt'
          Set-Content $stale 'old'
          $userData = Join-Path $env:APPDATA 'DSM_GUI'
          $marker = Join-Path $userData 'installer_test_marker.txt'
          New-Item -ItemType Directory -Force $userData | Out-Null
          Set-Content $marker 'keep'
          $running = Start-Process "$dir\DSMediaplay_app.exe" -PassThru
          Start-Sleep -Seconds 8

          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait
          if (Test-Path $stale) { throw 'The old version was not uninstalled first: a file of it is still there' }
          if (-not (Test-Path "$dir\DSMediaplay_app.exe")) { throw 'The reinstall did not install DSMediaplay_app.exe' }
          if (-not (Test-Path $uninstallKey)) { throw 'No uninstall entry after the reinstall' }
          if (-not (Test-Path $shortcut)) { throw 'No Start menu shortcut after the reinstall' }
          if (-not $running.HasExited) { throw 'The running instance of the old version was not closed' }
          if (-not (Test-Path $marker)) { throw 'The reinstall removed the user data' }
          & "$env:ProgramFiles\Git\bin\bash.exe" packaging/smoke_test.sh "$dir\DSMediaplay_app.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The reinstalled application failed the smoke test' }

          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller finishes in a temporary copy of itself, so wait for the result
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -or (Test-Path $uninstallKey) -or (Test-Path $shortcut)) {
            if ((Get-Date) -gt $deadline) { throw 'The uninstaller left files, the shortcut or the registry entry behind' }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $marker)) { throw 'The uninstaller removed the user data' }
          Remove-Item $marker

      # GitHub wraps every artifact in a zip; a release asset is the file itself, so releases carry the bare installer.
      # macOS keeps its own zip because artifact uploads drop file permissions and symlinks that the .app needs.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/DSMediaplay_app.app DSMediaplay_app-macos.zip

      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DSMediaplay_app-windows
          path: dist-installer/DSMediaplay_app-Setup-*.exe
          if-no-files-found: error

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DSMediaplay_app-macos
          path: DSMediaplay_app-macos.zip
          if-no-files-found: error

  release:
    # Runs for a tag push or when a release tag is given; only after every requested platform built successfully
    needs: build
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          shopt -s nullglob
          files=(artifacts/DSMediaplay_app-windows/DSMediaplay_app-Setup-*.exe artifacts/DSMediaplay_app-macos/DSMediaplay_app-macos*.zip)
          [ "${#files[@]}" -gt 0 ] || { echo "No release files found"; exit 1; }
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DSMediaplay_app $TAG" --generate-notes
